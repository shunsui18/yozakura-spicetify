; ╔══════════════════════════════════════════════════════════════════╗
; ║           Yozakura — Yoru                                        ║
; ║   Switch accent: spicetify config color_scheme Bloom             ║
; ║   Then apply:    spicetify apply                                 ║
; ║                                                                  ║
; ║   Base variant:  spicetify config color_scheme Base              ║
; ║                  Activates multi-accent mode — all 16 Yoru       ║
; ║                  accents applied simultaneously across UI zones  ║
; ║                  by html[data-yoza-mode="base"] in user.css.     ║
; ║                  The button value below is the Spicetify-level   ║
; ║                  fallback only; the switcher extension handles   ║
; ║                  the rest at runtime.                            ║
; ╚══════════════════════════════════════════════════════════════════╝
